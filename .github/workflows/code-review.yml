name: Code Review

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  quality:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # The old semgrep-action crashed on start ("invalid rule severity value:
  # MEDIUM") and still reported success, so nothing was ever scanned. This runs
  # the current CLI in its own image and prints every finding. It reports
  # rather than blocks until the first results have been reviewed.
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/default --config p/typescript --config p/react --config p/secrets --metrics=off --exclude node_modules --exclude e2e/screenshots

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Report everything high and above; fail the build on a critical one
      # that has a fix. exit-code 0 on its own meant a critical sat in the
      # log with the job green.
      - name: Report high and critical vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  firebase-rules:
    name: Firebase rules security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # The audit's API checks need the order route running against the
      # emulators; the script starts it (see e2e/run-security-audit.sh).
      - run: npx firebase emulators:exec --project demo-lehart --only auth,firestore,storage "sh e2e/run-security-audit.sh"

  # The browser suites: staff day in admin, catalogue import, checkout and the
  # security headers, in a real Chromium against the emulators.
  browser-e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build --mode e2e
      - run: npx firebase emulators:exec --project demo-lehart --only auth,firestore,storage "sh e2e/run-browser-suites.sh"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: ignore
