name: Code Review

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  quality:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: auto

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  firebase-rules:
    name: Firebase rules security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # The audit's API checks need the order route running against the
      # emulators. Without it they were skipped and the "API server
      # reachable" control failed on every run. ALLOW_UNPAID_ORDERS opens the
      # unpaid order route for this emulator-only server so the pricing and
      # validation code behind it can be attacked; it is never set in prod.
      - run: >-
          npx firebase emulators:exec --project demo-lehart --only auth,firestore,storage
          "sh -c 'ALLOW_UNPAID_ORDERS=true node e2e/api-server.mjs & API=$!;
          for i in $(seq 90); do curl -s -o /dev/null http://127.0.0.1:4174/ && break; sleep 1; done;
          npm run audit:security; s=$?; kill $API; exit $s'"
