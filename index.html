<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint under a notch and a gesture bar;
         the app shell then pays that back with env(safe-area-inset-*). Without
         it the tab bar floats above a white strip on every modern phone, and
         inside an APK there is no browser chrome to disguise it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Refurbished Phones UK — Unlocked iPhone, Samsung, Pixel | LeHart</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Refurbished Phones UK — Unlocked iPhone, Samsung, Pixel | LeHart" />
    <meta name="description" content="Certified refurbished phones, tablets and tech with 12-month warranty, free next-day delivery and 30-day returns. Unlocked iPhone, Samsung Galaxy, Google Pixel and iPad at UK refurb prices." />
    <meta name="keywords" content="refurbished phones, refurbished iphone, refurbished samsung, refurbished pixel, cheap iphone uk, second hand iphone, unlocked refurbished phones, refurbished ipad, used phones uk, refurbished smartphones, mobile phone deals uk" />
    <meta name="author" content="LeHart" />
    <meta name="robots" content="index,follow,max-image-preview:large" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://lehart.co.uk/" />
    <meta property="og:title" content="Refurbished Phones UK — Unlocked iPhone, Samsung, Pixel | LeHart" />
    <meta property="og:description" content="Certified refurbished phones, tablets and tech with 12-month warranty, free next-day delivery and 30-day returns." />
    <meta property="og:image" content="https://lehart.co.uk/assets/TYsh56U5ZjIX.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="LeHart" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://lehart.co.uk/" />
    <meta property="twitter:title" content="Refurbished Phones UK — Unlocked iPhone, Samsung, Pixel | LeHart" />
    <meta property="twitter:description" content="Certified refurbished phones, tablets and tech with 12-month warranty, free next-day delivery and 30-day returns." />
    <meta property="twitter:image" content="https://lehart.co.uk/assets/TYsh56U5ZjIX.png" />

    <!-- Additional Meta Tags -->
    <!-- Installable / APK wrapping. A Trusted Web Activity takes its name,
         icon, colours, orientation and start URL from this manifest, so the
         Android build is a Bubblewrap run against it rather than a separate
         project to keep in sync. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Tab-strip icon. The SVG is listed first because a browser that
         understands one will take it and stop, and a vector never gets
         resampled at any zoom or device pixel ratio.

         The PNGs behind it are drawn at each size rather than downscaled
         from a single master: the tab strip renders 16 CSS px, and squeezing
         a 48px thin-stroke glyph into 16 is what turned the mark to mud.
         Every one of these is generated by scripts/generate-icons.mjs, which
         also keeps the corners transparent — they used to be flattened onto
         white, which put four bright notches around the tile on a dark tab
         strip.

         The ?v= is not decoration. Chrome keeps favicons in a database of
         its own, keyed by URL and separate from the HTTP cache, and it will
         happily go on drawing a stale icon through reloads and redeploys —
         so replacing the file alone does not replace what the tab shows.
         A new URL is what forces the re-fetch. Bump it whenever the icons
         are regenerated. -->
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon-16.png?v=2" type="image/png" sizes="16x16" />
    <link rel="icon" href="/favicon-32.png?v=2" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-48.png?v=2" type="image/png" sizes="48x48" />
    <!-- iOS masks this itself, so it is full bleed and opaque: a rounded
         corner here is clipped twice and a transparent one goes black. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" sizes="180x180" />
    <meta name="theme-color" content="#a16207" />
    <meta name="apple-mobile-web-app-title" content="LeHart" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Nunito+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="dns-prefetch" href="https://placehold.co" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="canonical" href="https://lehart.co.uk/" />
    <link rel="alternate" hreflang="en-GB" href="https://lehart.co.uk/" />
    <link rel="alternate" hreflang="x-default" href="https://lehart.co.uk/" />

    <!-- Site-level structured data (Organization + Website SearchAction) -->
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "LeHart",
        "url": "https://lehart.co.uk",
        "logo": "https://lehart.co.uk/assets/TYsh56U5ZjIX.png"
      },
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "LeHart",
        "url": "https://lehart.co.uk",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://lehart.co.uk/products?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    ]
    </script>

    <style>
      /* Inline for the same reason as the markup below: this has to paint
         while the real stylesheet is still in flight. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8f9fa;
        /* Fills the notch and the gesture bar, which viewport-fit=cover
           otherwise leaves as bare white strips on a standalone launch. */
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                 env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        /* Faded out by main.tsx rather than cut, so a fast boot does not
           flash. The element is removed once this finishes. */
        transition: opacity 260ms ease;
      }
      #app-splash[data-leaving="true"] { opacity: 0; pointer-events: none; }

      .app-splash__tile {
        width: 68px;
        height: 68px;
        border-radius: 18px;
        background: #a16207;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: app-splash-spin 1.1s linear infinite;
      }
      .app-splash__tile svg { width: 34px; height: 34px; }

      .app-splash__word {
        margin: 4px 0 0;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #1c1917;
        /* Rises in after the mark, so the eye lands on the logo first. */
        animation: app-splash-rise 420ms 120ms ease both;
      }
      .app-splash__word span { color: #a16207; }

      .app-splash__tag {
        margin: 0;
        font-size: 13px;
        color: #6b7280;
        animation: app-splash-rise 420ms 260ms ease both;
      }

      @keyframes app-splash-spin { to { transform: rotate(360deg); } }
      @keyframes app-splash-rise {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: none; }
      }

      /* A spinning logo and rising text are exactly what this setting is
         for. The splash still shows; it simply holds still. */
      @media (prefers-reduced-motion: reduce) {
        .app-splash__tile,
        .app-splash__word,
        .app-splash__tag { animation: none; }
        #app-splash { transition: none; }
      }
    </style>

    <!-- Unhashed on purpose: the recovery for a bundle that failed to load
         cannot itself be part of that bundle. Blocking on purpose too: it has
         to register its listener before the module script below starts.
         See public/boot-check.js. -->
    <script src="/boot-check.js"></script>
  </head>
  <body>
    <!-- Boot splash.
         Between the first paint and React mounting there is nothing on
         screen. In a browser that gap is covered by the tab and the address
         bar; launched from a home screen or wrapped as an APK there is no
         chrome at all, so the app opens on a blank white rectangle for as
         long as the bundle takes to arrive and parse. This is what fills it.

         Written by hand, inline, with no imports: it has to paint before the
         stylesheet and the bundle it is covering for have loaded. The mark is
         the same brown tile and refresh glyph the navbar draws and the
         installed icon uses, so the first thing shown is the last thing the
         user tapped.

         It is a SIBLING of #root, never a child: public/boot-check.js decides
         whether the app booted by asking whether #root is empty, and splash
         markup inside it would make a failed boot look like a successful one.

         Removed by src/main.tsx once React has painted. If the bundle never
         arrives, boot-check.js clears it and says so instead. -->
    <div id="app-splash" role="status" aria-live="polite">
      <div class="app-splash__tile" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
          <path d="M21 21v-5h-5" />
        </svg>
      </div>
      <p class="app-splash__word">Le<span>Hart</span></p>
      <p class="app-splash__tag">Certified refurbished tech</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
